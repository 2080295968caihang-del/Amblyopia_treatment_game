<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2.0 画风选择预览 · 第二批</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
  h1 { text-align: center; font-size: 22px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
  .card { background: #1c1c1c; border-radius: 14px; padding: 14px; width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .card h2 { text-align: center; font-size: 17px; margin: 6px 0; }
  .card p { font-size: 13px; color: #bbb; text-align: center; margin: 4px 0 10px; }
  canvas { width: 100%; height: 220px; border-radius: 10px; display: block; }
  .tag { display: inline-block; background: #333; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #ffd400; }
</style>
</head>
<body>
<h1>v2.0 画风选择 · 第二批方案（D / E / F / G）</h1>
<div class="row">
  <div class="card">
    <h2>D · 发光霓虹 <span class="tag">高对比科幻</span></h2>
    <canvas id="cD"></canvas>
    <p>深色底 + 霓虹发光轮廓，蛇与食物自带光晕，对比极强、醒目清晰。</p>
  </div>
  <div class="card">
    <h2>E · 立体软糖 <span class="tag">果冻体积感</span></h2>
    <canvas id="cE"></canvas>
    <p>每节如饱满果冻，球体光影 + 半透明高光，鲜艳可爱、细节丰富。</p>
  </div>
  <div class="card">
    <h2>F · 丛林毛毛虫 <span class="tag">自然童趣</span></h2>
    <canvas id="cF"></canvas>
    <p>毛毛虫身体（圆节渐变 + 触角 + 大眼睛），食物是叶子，亲和力强。</p>
  </div>
  <div class="card">
    <h2>G · 简约扁平 <span class="tag">大色块高辨识</span></h2>
    <canvas id="cG"></canvas>
    <p>粗圆头大圆角、扁平大色块 + 少量高光，形状最大最清晰，最适合弱视。</p>
  </div>
</div>
<script>
function bgDots(ctx, w, h) {
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let y = 20; y < h; y += 36) for (let x = 20; x < w; x += 36) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glowCircle(ctx, x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 2.2);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2); ctx.fill();
}
// D · 发光霓虹
function drawD(ctx, w, h) {
  bgDots(ctx, w, h);
  const segs = [[42,110],[72,110],[102,110],[132,110],[162,110]];
  for (let i = segs.length - 1; i >= 0; i--) {
    const [x, y] = segs[i];
    glowCircle(ctx, x, y, 16, i === 0 ? 'rgba(57,255,20,.5)' : 'rgba(0,230,118,.35)');
    const g = ctx.createLinearGradient(x, y - 14, x, y + 14);
    g.addColorStop(0, i === 0 ? '#ccffcc' : '#00E676');
    g.addColorStop(1, i === 0 ? '#69F0AE' : '#00C853');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();
  }
  const hx = segs[0][0], hy = segs[0][1];
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 5, hy - 5, 4.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#00C853'; ctx.beginPath(); ctx.arc(hx + 5, hy - 5, 2.2, 0, Math.PI * 2); ctx.fill();
  const fx = 212, fy = 62;
  glowCircle(ctx, fx, fy, 16, 'rgba(255,45,85,.55)');
  const g2 = ctx.createLinearGradient(fx, fy - 13, fx, fy + 13);
  g2.addColorStop(0, '#ff8a80'); g2.addColorStop(1, '#d50000');
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(fx, fy, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(fx - 4, fy - 4, 3.4, 0, Math.PI * 2); ctx.fill();
}
// E · 立体软糖
function drawE(ctx, w, h) {
  bgDots(ctx, w, h);
  const segs = [[42,110],[72,110],[102,110],[132,110],[162,110]];
  for (let i = segs.length - 1; i >= 0; i--) {
    const [x, y] = segs[i];
    const g = ctx.createRadialGradient(x - 4, y - 6, 3, x, y, 17);
    g.addColorStop(0, i === 0 ? '#a5ffd6' : '#69F0AE');
    g.addColorStop(0.55, i === 0 ? '#00E676' : '#00B248');
    g.addColorStop(1, i === 0 ? '#00793d' : '#004d24');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 15, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.ellipse(x - 5, y - 7, 6, 3.4, -0.5, 0, Math.PI * 2); ctx.fill();
  }
  const hx = segs[0][0], hy = segs[0][1];
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(hx + 5, hy - 5, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(hx + 6, hy - 4, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e53935'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx + 8, hy + 5); ctx.quadraticCurveTo(hx + 16, hy + 7, hx + 12, hy + 12); ctx.stroke();
  // gummy bear-ish candy
  const fx = 214, fy = 60;
  const g3 = ctx.createRadialGradient(fx - 3, fy - 4, 2, fx, fy, 16);
  g3.addColorStop(0, '#ffd3e0'); g3.addColorStop(0.5, '#ff4081'); g3.addColorStop(1, '#b4004e');
  ctx.fillStyle = g3;
  ctx.beginPath(); ctx.arc(fx, fy - 8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(fx, fy + 4, 9, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(fx - 3, fy - 10, 2.4, 0, Math.PI * 2); ctx.fill();
}
// F · 丛林毛毛虫
function drawF(ctx, w, h) {
  bgDots(ctx, w, h);
  const segs = [[44,112],[74,108],[104,114],[134,108],[162,112]];
  for (let i = segs.length - 1; i >= 0; i--) {
    const [x, y] = segs[i];
    const g = ctx.createLinearGradient(x, y - 15, x, y + 15);
    g.addColorStop(0, i === 0 ? '#b2ff59' : '#7cb342');
    g.addColorStop(1, i === 0 ? '#76ff03' : '#558b2f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(x - 4, y - 6, 5, 3, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();
  }
  const hx = segs[0][0], hy = segs[0][1];
  // antennae
  ctx.strokeStyle = '#33691e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx + 8, hy - 8); ctx.quadraticCurveTo(hx + 14, hy - 20, hx + 20, hy - 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx - 2, hy - 12); ctx.quadraticCurveTo(hx - 4, hy - 24, hx + 2, hy - 26); ctx.stroke();
  ctx.fillStyle = '#ff7043'; ctx.beginPath(); ctx.arc(hx + 20, hy - 18, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff7043'; ctx.beginPath(); ctx.arc(hx + 2, hy - 26, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(hx + 6, hy - 4, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(hx + 7, hy - 3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 8, hy - 4.4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx - 3, hy + 9); ctx.quadraticCurveTo(hx + 2, hy + 14, hx + 8, hy + 10); ctx.stroke();
  // leaf food
  const fx = 216, fy = 58;
  const g2 = ctx.createLinearGradient(fx - 16, fy - 12, fx + 16, fy + 14);
  g2.addColorStop(0, '#aeea00'); g2.addColorStop(1, '#558b2f');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.moveTo(fx, fy + 16);
  ctx.quadraticCurveTo(fx - 22, fy + 6, fx - 14, fy - 10);
  ctx.quadraticCurveTo(fx - 4, fy - 16, fx + 2, fy - 2);
  ctx.quadraticCurveTo(fx + 10, fy - 16, fx + 20, fy - 8);
  ctx.quadraticCurveTo(fx + 26, fy + 4, fx, fy + 16);
  ctx.fill();
  ctx.strokeStyle = '#33691e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(fx, fy + 16); ctx.lineTo(fx + 2, fy - 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(fx - 6, fy - 2, 4, 7, 0.4, 0, Math.PI * 2); ctx.fill();
}
// G · 简约扁平
function drawG(ctx, w, h) {
  bgDots(ctx, w, h);
  const segs = [[44,112],[76,112],[108,112],[140,112]];
  for (let i = segs.length - 1; i >= 0; i--) {
    const [x, y] = segs[i];
    ctx.fillStyle = i === 0 ? '#00C853' : '#2E9E4F';
    roundRect(ctx, x - 16, y - 15, 32, 30, 14);
    ctx.fill();
  }
  const hx = segs[0][0], hy = segs[0][1];
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 5, hy - 5, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#123'; ctx.beginPath(); ctx.arc(hx + 6, hy - 5, 2.6, 0, Math.PI * 2); ctx.fill();
  // big fruit food
  const fx = 216, fy = 64;
  ctx.fillStyle = '#ff5252';
  ctx.beginPath(); ctx.arc(fx, fy, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7cff00';
  ctx.beginPath(); ctx.moveTo(fx - 5, fy - 13); ctx.lineTo(fx + 5, fy - 13); ctx.lineTo(fx + 8, fy - 21); ctx.lineTo(fx, fy - 16); ctx.lineTo(fx - 8, fy - 21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(fx - 5, fy - 5, 3.6, 0, Math.PI * 2); ctx.fill();
}
const D = document.getElementById('cD'), E = document.getElementById('cE'), F = document.getElementById('cF'), G = document.getElementById('cG');
[D, E, F, G].forEach(c => { c.width = 320; c.height = 220; });
drawD(D.getContext('2d'), 320, 220);
drawE(E.getContext('2d'), 320, 220);
drawF(F.getContext('2d'), 320, 220);
drawG(G.getContext('2d'), 320, 220);
</script>
</body>
</html>
