<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>弱视治疗贪吃蛇</title>
<style>
/* ===== 全局与高对比配色 ===== */
:root {
  --color-bg: #000000;
  --color-fg: #ffffff;
  --color-accent: #ffd400;
  --color-danger: #ff2d2d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: var(--color-bg);
  color: var(--color-fg);
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.hidden { display: none !important; }

/* ===== 屏幕容器 ===== */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 16px;
  text-align: center;
  z-index: 1;
}

/* ===== 通用按钮 ===== */
.btn {
  font-size: clamp(20px, 3vmin, 28px);
  font-weight: bold;
  padding: 14px 34px;
  border-radius: 12px;
  border: 3px solid var(--color-accent);
  background: transparent;
  color: var(--color-accent);
  cursor: pointer;
  transition: filter 0.15s, transform 0.05s;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: #000000;
}

/* ===== 自测横幅 ===== */
#testBanner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 8px 12px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}
#testBanner.test-pass { background: #005500; color: #ffffff; }
#testBanner.test-fail { background: #770000; color: #ffffff; }

/* ===== 开始屏 ===== */
#startScreen h1 {
  font-size: clamp(32px, 6vmin, 64px);
  letter-spacing: 4px;
  color: var(--color-accent);
  text-shadow: 0 0 18px rgba(255, 212, 0, 0.5);
}
.eye-reminder {
  max-width: 640px;
  font-size: clamp(20px, 3.4vmin, 32px);
  font-weight: bold;
  color: var(--color-fg);
  background: #1a1a00;
  border: 3px solid var(--color-accent);
  border-radius: 14px;
  padding: 12px 24px;
}
.high-score {
  font-size: clamp(18px, 3vmin, 28px);
  color: var(--color-fg);
}
.high-score span {
  color: var(--color-accent);
  font-size: 1.25em;
  font-weight: bold;
}
.btn-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== 游戏屏 ===== */
#gameScreen {
  justify-content: flex-start;
  gap: 10px;
  padding-top: 10px;
}
.hud {
  width: 100%;
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: clamp(16px, 2.6vmin, 24px);
  font-weight: bold;
}
.hud .stat { display: flex; align-items: center; gap: 6px; }
.hud .stat span { color: var(--color-accent); }
.hud .btn {
  font-size: clamp(14px, 2.2vmin, 20px);
  padding: 8px 16px;
  border-width: 2px;
}
.board-wrap {
  position: relative;
  width: min(90vmin, 640px);
  aspect-ratio: 1 / 1;
  background: #000000;
  border: 3px solid var(--color-accent);
  touch-action: none; /* 触控预留：避免触摸滚动干扰后续触控操控 */
}
#bgCanvas,
#gameCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.small-tip {
  font-size: clamp(13px, 2vmin, 18px);
  color: #cccccc;
}

/* ===== 结束浮层 ===== */
.mask {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 9;
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}
.overlay-card {
  min-width: min(320px, 86vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 28px 40px;
  background: #111111;
  border: 3px solid var(--color-accent);
  border-radius: 16px;
  font-size: clamp(18px, 2.8vmin, 26px);
}
.overlay-card h2 { color: var(--color-danger); }
.overlay-card .stat span { color: var(--color-accent); font-weight: bold; }

/* ===== 设置抽屉 ===== */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 11;
  width: min(380px, 92vw);
  padding: 20px 22px;
  background: #101010;
  border-left: 3px solid var(--color-accent);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  font-size: clamp(15px, 2.4vmin, 20px);
}
.drawer h2 {
  color: var(--color-accent);
  border-bottom: 2px solid #333333;
  padding-bottom: 8px;
}
.drawer-close {
  position: absolute;
  top: 12px;
  right: 14px;
  background: none;
  border: none;
  color: var(--color-fg);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}
.setting-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border: 2px solid #333333;
  border-radius: 10px;
  padding: 10px 12px;
}
.setting-group legend {
  color: var(--color-accent);
  font-weight: bold;
  padding: 0 6px;
}
.option-row {
  display: flex;
  align-items: center;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.option-row label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
input[type="radio"],
input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--color-accent);
  cursor: pointer;
}
</style>
</head>
<body>
<!-- 自测结果横幅（?test=1 时由脚本填充并显示） -->
<div id="testBanner" class="hidden"></div>

<!-- 开始屏 -->
<div id="startScreen" class="screen">
  <h1>弱视治疗贪吃蛇</h1>
  <p class="eye-reminder">请先遮盖好眼，只用弱视眼看</p>
  <div class="high-score">最高分：<span id="startHighScore">0</span></div>
  <div class="btn-group">
    <button id="btnStart" class="btn btn-primary" type="button">开始游戏</button>
    <button id="btnOpenSettings" class="btn" type="button">家长设置</button>
  </div>
</div>

<!-- 游戏屏：底层刺激背景 + 中层蛇/食物 -->
<div id="gameScreen" class="screen hidden">
  <div class="hud">
    <div class="stat">分数 <span id="hudScore">0</span></div>
    <div class="stat">最高 <span id="hudHighScore">0</span></div>
    <div class="stat">速度 <span id="hudSpeed">1</span></div>
    <div class="stat">
      <button id="btnPause" class="btn" type="button">暂停</button>
      <button id="btnMute" class="btn" type="button">静音</button>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="bgCanvas" width="630" height="630"></canvas>
    <canvas id="gameCanvas" width="630" height="630"></canvas>
  </div>
  <p class="small-tip">遮盖好眼，只用弱视眼看</p>
</div>

<!-- 结束浮层 -->
<div id="endOverlay" class="overlay hidden">
  <div class="overlay-card">
    <h2>游戏结束</h2>
    <div class="stat">本次分数 <span id="endScore">0</span></div>
    <div class="stat">最高分 <span id="endHighScore">0</span></div>
    <button id="btnRestart" class="btn btn-primary" type="button">再玩一次</button>
  </div>
</div>

<!-- 设置抽屉遮罩 -->
<div id="drawerMask" class="mask hidden"></div>

<!-- 家长设置抽屉 -->
<aside id="settingsDrawer" class="drawer hidden" role="dialog" aria-label="家长设置">
  <button id="btnDrawerClose" class="drawer-close" type="button" aria-label="关闭设置">×</button>
  <h2>家长设置</h2>

  <fieldset class="setting-group">
    <legend>闪烁档位</legend>
    <div class="option-row">
      <label><input type="radio" name="flickerLevel" value="0"> 慢 0.95Hz</label>
      <label><input type="radio" name="flickerLevel" value="1" checked> 中 1.4Hz</label>
      <label><input type="radio" name="flickerLevel" value="2"> 快 2.4Hz</label>
    </div>
  </fieldset>

  <fieldset class="setting-group">
    <legend>刺激模式（勾选参与轮换）</legend>
    <div class="option-row">
      <label><input type="checkbox" name="mode" value="red_flicker" checked> 红光闪烁</label>
      <label><input type="checkbox" name="mode" value="cam_grating" checked> CAM 光栅</label>
      <label><input type="checkbox" name="mode" value="checkerboard" checked> 棋盘格</label>
      <label><input type="checkbox" name="mode" value="dots" checked> 圆点阵列</label>
      <label><input type="checkbox" name="mode" value="stripes" checked> 对比条纹</label>
      <label><input type="checkbox" name="mode" value="fun_shapes" checked> 童趣图案</label>
    </div>
  </fieldset>

  <fieldset class="setting-group">
    <legend>配色模式</legend>
    <div class="option-row">
      <label><input type="radio" name="colorMode" value="contrast" checked> 高对比</label>
      <label><input type="radio" name="colorMode" value="mixed"> 混合（带彩色点缀）</label>
    </div>
  </fieldset>

  <fieldset class="setting-group">
    <legend>起始速度</legend>
    <div class="option-row">
      <label><input type="radio" name="startSpeed" value="1"> 1 很慢</label>
      <label><input type="radio" name="startSpeed" value="2" checked> 2 慢</label>
      <label><input type="radio" name="startSpeed" value="3"> 3 中</label>
      <label><input type="radio" name="startSpeed" value="4"> 4 快</label>
      <label><input type="radio" name="startSpeed" value="5"> 5 很快</label>
    </div>
  </fieldset>

  <fieldset class="setting-group">
    <legend>音效</legend>
    <div class="option-row">
      <label><input type="checkbox" id="soundOn" checked> 开启音效</label>
    </div>
  </fieldset>

  <fieldset class="setting-group">
    <legend>背景变化开关</legend>
    <div class="option-row">
      <label><input type="checkbox" id="colorChange" checked> 颜色变化</label>
      <label><input type="checkbox" id="shapeChange" checked> 形状变化</label>
      <label><input type="checkbox" id="flickerChange" checked> 闪烁</label>
    </div>
  </fieldset>
</aside>

<script>
/* =========================================================
 * 弱视治疗贪吃蛇 · 骨架与自测框架
 * 常量与核心纯函数零依赖，可在 Node 中直接运行。
 * ========================================================= */

/* ---------- 常量 ---------- */
const GRID_SIZE = 21;                  // 21×21 网格
const SPEED_START_MS = 180;            // 起始速度（毫秒/格，默认中慢）
const SPEED_MIN_MS = 60;               // 速度上限（最快）
const SPEED_STEP = 5;                  // 每吃 5 个食物升一档
const SPEED_DELTA_MS = 20;             // 每升一档速度减少的毫秒数
const MAX_SPEED_LEVEL = 1 + Math.floor((SPEED_START_MS - SPEED_MIN_MS) / SPEED_DELTA_MS); // 速度上限对应的最大档位
const FLICKER_LEVELS = [0.95, 1.4, 2.4]; // 慢/中/快 Hz
const DIR_VECTORS = {                  // 方向 → 单位向量（模块级常量，避免每次调用重建）
  up: { x: 0, y: -1 },
  down: { x: 0, y: 1 },
  left: { x: -1, y: 0 },
  right: { x: 1, y: 0 }
};

/* ---------- 核心纯函数 ---------- */
// 方向 → 单位向量（未知方向返回零向量）
function dirToVector(dir) {
  return DIR_VECTORS[dir] || { x: 0, y: 0 };
}

// 返回头部沿方向移动一格后的坐标
function nextHead(head, dir) {
  const v = dirToVector(dir);
  return { x: head.x + v.x, y: head.y + v.y };
}

// 越界判断（0 ≤ 坐标 < GRID_SIZE）
function isWallCollision(head) {
  return head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
}

// 撞自身判断：head 为移动后的新头，与蛇身任一段重叠即算。
// excludeTail=true 时忽略蛇尾——蛇不进食移动时尾段同时腾空，
// 蛇头移入当前尾格是合法操作；调用方在“蛇不增长”的那次移动中应传 true。
function isSelfCollision(head, snake, excludeTail) {
  const end = excludeTail ? snake.length - 1 : snake.length;
  for (let i = 0; i < end; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) return true;
  }
  return false;
}

// 在非蛇身位置随机生成食物
function randomFoodCell(snake) {
  const occupied = {};
  for (let i = 0; i < snake.length; i++) {
    occupied[snake[i].x + ',' + snake[i].y] = true;
  }
  const free = [];
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      if (!occupied[x + ',' + y]) free.push({ x: x, y: y });
    }
  }
  if (free.length === 0) return null; // 棋盘被蛇占满的极端情况
  return free[Math.floor(Math.random() * free.length)];
}

// 每吃 SPEED_STEP 个食物降一档速度（毫秒/格），最低不低于 SPEED_MIN_MS
function speedForLevel(foodsEaten) {
  const level = Math.floor(foodsEaten / SPEED_STEP);
  return Math.max(SPEED_MIN_MS, SPEED_START_MS - level * SPEED_DELTA_MS);
}

// 闪烁频率档位映射：0/1/2 → 0.95/1.4/2.4 Hz，越界时回退到最快档
function flickerHzForLevel(level) {
  if (level < 0 || level >= FLICKER_LEVELS.length) return FLICKER_LEVELS[FLICKER_LEVELS.length - 1];
  return FLICKER_LEVELS[level];
}



/* ---------- 背景刺激层：常量与可测试纯函数（Task 4） ---------- */

// 6 种刺激模式（索引顺序与设置面板勾选值一致）
const MODE_IDS = ['red_flicker', 'cam_grating', 'checkerboard', 'dots', 'stripes', 'fun_shapes'];

// 高对比配色组：{name, fg 图案前景, bg 背景}，每 20-40s 随机轮换一组
const COLOR_PALETTES = [
  { name: '黑白', fg: '#ffffff', bg: '#000000' },
  { name: '红白', fg: '#ff0000', bg: '#ffffff' },
  { name: '蓝黄', fg: '#ffd400', bg: '#0000ff' },
  { name: '绿黑', fg: '#00ff00', bg: '#000000' }
];

// 混合模式（colorMode='mixed'）的彩色点缀颜色池
const ACCENT_COLORS = ['#ff2d2d', '#ffd400', '#00e5ff', '#ff66ff', '#7cff00', '#ff9d00'];

// 轮换/点缀周期常量
const BG_ROTATE_MIN_MS = 20000;   // 模式/配色轮换最短周期 20s
const BG_ROTATE_MAX_MS = 40000;   // 模式/配色轮换最长周期 40s
const BG_ACCENT_MIN_MS = 5000;    // 混合模式点缀最短周期 5s
const BG_ACCENT_MAX_MS = 8000;    // 混合模式点缀最长周期 8s
const BG_DRIFT_PX = 60;           // 图案整体平移速度（约 1px/tick @60fps）
const BG_FLICKER_JITTER = 0.2;    // 闪烁频率 ±20% 抖动
const ACCENT_MAX = 16;            // 混合模式点缀数量上限

// 设置对象：Task 5 接入家长设置面板后由其改写，默认值与 defaultSettings 一致
const settings = {
  flickerLevel: 1,                  // 0/1/2 → 0.95/1.4/2.4 Hz
  modes: [true, true, true, true, true, true], // 6 种模式是否参与轮换
  colorMode: 'contrast',            // 'contrast' 高对比 | 'mixed' 混合（带彩色点缀）
  soundOn: true,                    // 音效开关（Task 6 使用）
  colorChange: true,                // 颜色变化开关
  shapeChange: true,                // 形状（模式）变化开关
  flickerChange: true               // 闪烁开关
};

// [min, max] 区间随机数
function randRange(min, max) {
  return min + Math.random() * (max - min);
}

// 从启用模式集合（enabledModes[i]===true）随机选下一个模式索引，
// 不连续两次相同（previousIndex）；无任何启用模式时返回 -1。
function pickNextMode(previousIndex, enabledModes) {
  const enabled = [];
  for (let i = 0; i < enabledModes.length; i++) {
    if (enabledModes[i]) enabled.push(i);
  }
  if (enabled.length === 0) return -1;
  if (enabled.length === 1) return enabled[0];
  let next = previousIndex;
  while (next === previousIndex) {
    next = enabled[Math.floor(Math.random() * enabled.length)];
  }
  return next;
}

// 从高对比配色组随机选一组索引，不连续两次相同
function pickColorPalette(previousIndex) {
  if (COLOR_PALETTES.length <= 1) return 0;
  let next = previousIndex;
  while (next === previousIndex) {
    next = Math.floor(Math.random() * COLOR_PALETTES.length);
  }
  return next;
}

// 闪烁频率抖动：baseHz × (0.8~1.2)，每次进入新模式重新取值
function jitterHz(baseHz) {
  return baseHz * (1 + (Math.random() * 2 - 1) * BG_FLICKER_JITTER);
}

// 确定性伪随机数生成器（mulberry32）：同一种子生成同一组图案几何，避免逐帧随机抖动
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 依据模式索引与种子预生成图案几何（条纹方向/粗细、圆点、童趣图案位置等）
function buildBgGeom(modeIndex, seed, w, h) {
  const rnd = mulberry32(seed);
  const geom = { type: modeIndex, items: [] };
  switch (modeIndex) {
    case 1: // cam_grating：方向横/竖/斜随机，条宽 40-80px
      geom.direction = ['horizontal', 'vertical', 'diagonal'][Math.floor(rnd() * 3)];
      geom.width = 40 + Math.floor(rnd() * 41);
      break;
    case 2: // checkerboard：100px 棋盘格
      geom.cell = 100;
      break;
    case 3: { // dots：圆点阵列，半径 8-16px
      const spacing = 56;
      for (let y = spacing / 2; y < h + spacing; y += spacing) {
        for (let x = spacing / 2; x < w + spacing; x += spacing) {
          geom.items.push({
            x: x + (rnd() - 0.5) * 12,
            y: y + (rnd() - 0.5) * 12,
            r: 8 + rnd() * 8
          });
        }
      }
      break;
    }
    case 4: { // stripes：粗细变化的对比条纹
      geom.direction = ['horizontal', 'vertical', 'diagonal'][Math.floor(rnd() * 3)];
      geom.widths = [];
      for (let i = 0; i < 6; i++) geom.widths.push(20 + Math.floor(rnd() * 61));
      break;
    }
    case 5: { // fun_shapes：星星/花朵/爱心/月亮随机排布
      const types = ['star', 'flower', 'heart', 'moon'];
      const count = Math.max(4, Math.floor((w * h) / 36000));
      for (let i = 0; i < count; i++) {
        geom.items.push({
          x: rnd() * w,
          y: rnd() * h,
          s: 24 + rnd() * 40,
          rot: rnd() * Math.PI * 2,
          type: types[Math.floor(rnd() * types.length)]
        });
      }
      break;
    }
  }
  return geom;
}

// 全屏红/黑：按 flickerHz 的 sin 波占空交替；闪烁关闭时整屏红色静止
function drawRedFlicker(ctx, t, cfg) {
  const w = cfg.w;
  const h = cfg.h;
  if (!cfg.flicker) {
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(0, 0, w, h);
    return;
  }
  const alpha = (Math.sin(2 * Math.PI * cfg.flickerHz * t) + 1) / 2;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ff0000';
  ctx.globalAlpha = alpha;
  ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;
}

// 黑白方波条纹（CAM 光栅）：方向随机，条宽 40-80px，整体缓慢平移（约 1px/tick）
function drawCamGrating(ctx, t, cfg) {
  const w = cfg.w;
  const h = cfg.h;
  const geom = cfg.geom;
  const width = geom.width;
  const period = width * 2;
  const offset = (t * BG_DRIFT_PX) % period;
  ctx.fillStyle = cfg.palette.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = cfg.palette.fg;
  if (geom.direction === 'vertical') {
    for (let x = -period + offset; x < w + period; x += period) ctx.fillRect(x, 0, width, h);
  } else if (geom.direction === 'horizontal') {
    for (let y = -period + offset; y < h + period; y += period) ctx.fillRect(0, y, w, width);
  } else {
    const len = Math.hypot(w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(Math.PI / 4);
    for (let y = -period + offset; y < len + period; y += period) ctx.fillRect(-len, y, len * 2, width);
    ctx.restore();
  }
}

// 100px 棋盘格：整体按 100px 周期缓慢跳动
function drawCheckerboard(ctx, t, cfg) {
  const w = cfg.w;
  const h = cfg.h;
  const cell = cfg.geom.cell;
  const offset = (t * BG_DRIFT_PX) % cell;
  ctx.fillStyle = cfg.palette.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = cfg.palette.fg;
  for (let gy = -1; gy * cell < h + cell; gy++) {
    for (let gx = -1; gx * cell < w + cell; gx++) {
      if (((gx + gy) & 1) === 0) ctx.fillRect(gx * cell + offset, gy * cell + offset, cell, cell);
    }
  }
}

// 高对比圆点阵列：半径 8-16px，网格排布带随机偏移
function drawDots(ctx, t, cfg) {
  const w = cfg.w;
  const h = cfg.h;
  ctx.fillStyle = cfg.palette.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = cfg.palette.fg;
  const items = cfg.geom.items;
  for (let i = 0; i < items.length; i++) {
    ctx.beginPath();
    ctx.arc(items[i].x, items[i].y, items[i].r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 粗细变化的对比条纹：随机方向 + 随机粗细序列，缓慢平移
function drawStripes(ctx, t, cfg) {
  const w = cfg.w;
  const h = cfg.h;
  const geom = cfg.geom;
  const widths = geom.widths;
  let total = 0;
  for (let i = 0; i < widths.length; i++) total += widths[i];
  const offset = (t * BG_DRIFT_PX) % total;
  const len = Math.hypot(w, h);
  ctx.fillStyle = cfg.palette.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = cfg.palette.fg;
  const limit = geom.direction === 'vertical' ? w : h;
  ctx.save();
  if (geom.direction === 'diagonal') {
    ctx.translate(w / 2, h / 2);
    ctx.rotate(Math.PI / 4);
  }
  let pos = -total + offset;
  let i = 0;
  while (pos < (geom.direction === 'diagonal' ? len : limit)) {
    const bw = widths[i % widths.length];
    if (i % 2 === 0) { // 隔条填充，形成明暗对比条纹
      if (geom.direction === 'vertical') ctx.fillRect(pos, 0, bw, h);
      else if (geom.direction === 'horizontal') ctx.fillRect(0, pos, w, bw);
      else ctx.fillRect(-len, pos, len * 2, bw);
    }
    pos += bw;
    i++;
  }
  ctx.restore();
}

// 五角星
function fillStar(ctx, s) {
  const outer = s / 2;
  const inner = outer * 0.4;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

// 花朵：中心圆 + 5 片花瓣圆
function fillFlower(ctx, s) {
  const r = s / 4;
  for (let i = 0; i < 5; i++) {
    const a = (i * Math.PI * 2) / 5;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 1.5, Math.sin(a) * r * 1.5, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.2, 0, Math.PI * 2);
  ctx.fill();
}

// 爱心（两条贝塞尔曲线）
function fillHeart(ctx, s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(s * 0.55, -s * 0.15, s * 0.3, -s * 0.55, 0, -s * 0.15);
  ctx.bezierCurveTo(-s * 0.3, -s * 0.55, -s * 0.55, -s * 0.15, 0, s * 0.35);
  ctx.closePath();
  ctx.fill();
}

// 月牙（两圆非零环绕相减）
function fillMoon(ctx, s) {
  const r = s / 2;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.arc(r * 0.45, -r * 0.25, r * 0.85, 0, Math.PI * 2, true);
  ctx.fill();
}

// 童趣图案：星星/花朵/爱心/月亮高对比随机排布
function drawFunShapes(ctx, t, cfg) {
  const w = cfg.w;
  const h = cfg.h;
  ctx.fillStyle = cfg.palette.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = cfg.palette.fg;
  const items = cfg.geom.items;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    if (it.type === 'star') fillStar(ctx, it.s);
    else if (it.type === 'flower') fillFlower(ctx, it.s);
    else if (it.type === 'heart') fillHeart(ctx, it.s);
    else fillMoon(ctx, it.s);
    ctx.restore();
  }
}

// 全局闪烁叠加：按 flickerHz 让整屏亮度随 sin 波起伏（red_flicker 模式自带闪烁，不叠加）
function drawFlickerOverlay(ctx, t, cfg) {
  const alpha = ((Math.sin(2 * Math.PI * cfg.flickerHz * t) + 1) / 2) * 0.35;
  ctx.fillStyle = '#000000';
  ctx.globalAlpha = alpha;
  ctx.fillRect(0, 0, cfg.w, cfg.h);
  ctx.globalAlpha = 1;
}

// 6 种模式绘制函数（索引与 MODE_IDS 一致）
const BG_DRAWERS = [drawRedFlicker, drawCamGrating, drawCheckerboard, drawDots, drawStripes, drawFunShapes];

/* ---------- 游戏状态与核心逻辑（纯函数，Node 可测） ---------- */

// 创建一局游戏的初始状态（纯数据）
function createInitialState() {
  return {
    snake: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
    dir: 'right',
    nextDir: 'right',
    food: null,
    score: 0,
    foodsEaten: 0,
    running: false,
    paused: false,
    gameOver: false,
    mouseActive: false
  };
}

// 判断两个方向是否互为 180° 反向
function isOppositeDir(a, b) {
  const va = dirToVector(a);
  const vb = dirToVector(b);
  return va.x + vb.x === 0 && va.y + vb.y === 0;
}

// 是否允许把方向改为 newDir（禁止 180° 反向；同方向/垂直方向允许）
function canSetDirection(currentDir, newDir) {
  return !isOppositeDir(currentDir, newDir);
}

// 输入层：把新方向写入 state.nextDir，反向时拒绝并返回 false（Task 3 接键盘/触控）
function setDirection(state, dir) {
  // 按 nextDir 判反向：一 tick 内先 up 再 down（相对待生效方向的 180° 反向）也应被拒绝
  if (!canSetDirection(state.nextDir || state.dir, dir)) return false;
  state.nextDir = dir;
  return true;
}

/* ---------- 输入控制（键盘 / 鼠标，Node 可测；directionForKey 为纯函数，其余原地修改型） ---------- */

// 数值钳制到 [min, max]：用于把越界的鼠标坐标收敛回网格
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

// 键位映射：方向键 / WASD（大小写皆可）→ 方向；其他键返回 null
function directionForKey(key) {
  switch (key) {
    case 'ArrowUp': case 'w': case 'W': return 'up';
    case 'ArrowDown': case 's': case 'S': return 'down';
    case 'ArrowLeft': case 'a': case 'A': return 'left';
    case 'ArrowRight': case 'd': case 'D': return 'right';
    default: return null;
  }
}

// 鼠标转向：由蛇头到鼠标网格坐标的向量取主导轴方向（水平/垂直分量较大者），
// 平局时优先水平；经 setDirection 语义写入 state.nextDir（禁止 180° 反向）。
// 鼠标坐标越界时先钳制回网格；鼠标正落在蛇头上时无方向，返回 false。
function steerByMouse(state, mouseCell) {
  if (!mouseCell) return false;
  const head = state.snake[0];
  const dx = clamp(mouseCell.x, 0, GRID_SIZE - 1) - head.x;
  const dy = clamp(mouseCell.y, 0, GRID_SIZE - 1) - head.y;
  if (dx === 0 && dy === 0) return false;
  let dir;
  if (Math.abs(dx) >= Math.abs(dy)) dir = dx >= 0 ? 'right' : 'left';
  else dir = dy >= 0 ? 'down' : 'up';
  return setDirection(state, dir);
}

// 暂停切换：原地翻转 state.paused 并返回 state（供空格/P 与 HUD 暂停按钮复用）
function togglePause(state) {
  state.paused = !state.paused;
  return state;
}

// 方向/暂停键统一入口：仅游戏运行中生效；未开始或 gameOver 后按键一律忽略并返回 false。
// 方向键成功写入时复位 mouseActive：键盘接管、鼠标跟随暂停，下次移动鼠标再恢复。
// 返回值：true 表示已消费该输入（含被 180° 反向拒绝的方向键），并非方向必然生效。
function handleGameKey(state, key) {
  if (!state.running || state.gameOver) return false;
  if (key === ' ' || key === 'p' || key === 'P') {
    togglePause(state); // 暂停键不干预鼠标跟随状态（恢复后延续当前控制方式）
    return true;
  }
  const dir = directionForKey(key);
  if (dir === null) return false;
  const applied = setDirection(state, dir);
  if (applied) state.mouseActive = false; // 键盘方向键接管：复位鼠标跟随
  return true;
}

// 走一步的核心纯逻辑：不修改传入 state，返回 { state, ate, gameOver }
// opts.foodCell 可选：指定吃食物后新食物的位置（默认随机生成，供测试确定性使用）
function stepGame(state, opts) {
  const opt = opts || {};
  // 生效方向：nextDir 与当前 dir 反向时回退到 dir（禁止 180° 反向的防御）
  const queued = state.nextDir || state.dir;
  const dir = isOppositeDir(queued, state.dir) ? state.dir : queued;
  const newHead = nextHead(state.snake[0], dir);
  // 是否吃到食物
  const ate = !!state.food && state.food.x === newHead.x && state.food.y === newHead.y;
  // 碰撞判定：不进食的 tick 尾段腾空（excludeTail=true）；进食的 tick 不腾尾（全段判定）
  const hitWall = isWallCollision(newHead);
  const hitSelf = isSelfCollision(newHead, state.snake, ate ? undefined : true);
  // 组装新蛇：进食不弹尾（蛇长 +1），未进食弹尾
  const newSnake = [newHead].concat(state.snake);
  if (!ate) newSnake.pop();
  // 进食后重新生成食物
  let newFood = state.food;
  if (ate) newFood = opt.foodCell || randomFoodCell(newSnake);
  return {
    state: {
      snake: newSnake,
      dir: dir,
      nextDir: dir,
      food: newFood,
      score: ate ? state.score + 10 : state.score,
      foodsEaten: ate ? state.foodsEaten + 1 : state.foodsEaten,
      running: state.running,
      paused: state.paused,
      mouseActive: state.mouseActive,
      gameOver: hitWall || hitSelf
    },
    ate: ate,
    gameOver: hitWall || hitSelf
  };
}

/* ---------- 自测框架 ---------- */
// 运行全部自测，返回 [{pass, name, detail?}]，纯逻辑、无 DOM 依赖
function runSelfTests() {
  const results = [];

  // 断言辅助：追加一条测试结果
  function check(name, cond, detail) {
    results.push({ pass: !!cond, name: name, detail: cond ? undefined : detail });
  }

  // 坐标点相等比较
  function samePoint(a, b) {
    return !!a && !!b && a.x === b.x && a.y === b.y;
  }

  // ---- dirToVector：四个方向 ----
  check('dirToVector: up → {0,-1}', samePoint(dirToVector('up'), { x: 0, y: -1 }), '实际 ' + JSON.stringify(dirToVector('up')));
  check('dirToVector: down → {0,1}', samePoint(dirToVector('down'), { x: 0, y: 1 }), '实际 ' + JSON.stringify(dirToVector('down')));
  check('dirToVector: left → {-1,0}', samePoint(dirToVector('left'), { x: -1, y: 0 }), '实际 ' + JSON.stringify(dirToVector('left')));
  check('dirToVector: right → {1,0}', samePoint(dirToVector('right'), { x: 1, y: 0 }), '实际 ' + JSON.stringify(dirToVector('right')));

  // ---- nextHead：移动后的头部坐标 ----
  check('nextHead: 右移一格', samePoint(nextHead({ x: 5, y: 5 }, 'right'), { x: 6, y: 5 }), '实际 ' + JSON.stringify(nextHead({ x: 5, y: 5 }, 'right')));
  check('nextHead: 上移一格', samePoint(nextHead({ x: 5, y: 5 }, 'up'), { x: 5, y: 4 }), '实际 ' + JSON.stringify(nextHead({ x: 5, y: 5 }, 'up')));
  check('nextHead: 左移越过左边界', samePoint(nextHead({ x: 0, y: 5 }, 'left'), { x: -1, y: 5 }), '实际 ' + JSON.stringify(nextHead({ x: 0, y: 5 }, 'left')));
  check('nextHead: 下移越过下边界', samePoint(nextHead({ x: 5, y: GRID_SIZE - 1 }, 'down'), { x: 5, y: GRID_SIZE }), '实际 ' + JSON.stringify(nextHead({ x: 5, y: GRID_SIZE - 1 }, 'down')));

  // ---- isWallCollision：边界 ----
  check('isWallCollision: 左上角界内', !isWallCollision({ x: 0, y: 0 }), '实际 true');
  check('isWallCollision: 右下角界内', !isWallCollision({ x: GRID_SIZE - 1, y: GRID_SIZE - 1 }), '实际 true');
  check('isWallCollision: 左越界', isWallCollision({ x: -1, y: 5 }), '实际 false');
  check('isWallCollision: 右越界', isWallCollision({ x: GRID_SIZE, y: 5 }), '实际 false');
  check('isWallCollision: 上越界', isWallCollision({ x: 5, y: -1 }), '实际 false');
  check('isWallCollision: 下越界', isWallCollision({ x: 5, y: GRID_SIZE }), '实际 false');

  // ---- isSelfCollision：撞自身（含新头；excludeTail=true 时忽略蛇尾） ----
  const body = [{ x: 3, y: 3 }, { x: 3, y: 4 }, { x: 2, y: 4 }];
  check('isSelfCollision: 新头撞到身体', isSelfCollision({ x: 2, y: 4 }, body), '实际 false');
  check('isSelfCollision: 新头与旧头重叠', isSelfCollision({ x: 3, y: 3 }, body), '实际 false');
  check('isSelfCollision: 未撞自身', !isSelfCollision({ x: 4, y: 4 }, body), '实际 true');
  check('isSelfCollision: 移入腾空尾格（excludeTail=true）不算碰撞', !isSelfCollision({ x: 2, y: 4 }, body, true), '实际 true');

  // ---- randomFoodCell：不在蛇身、且在网格内 ----
  {
    const snake = [];
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if ((x + y) % 2 === 0) snake.push({ x: x, y: y });
      }
    }
    let foodOk = true;
    let failDetail = '';
    for (let i = 0; i < 200 && foodOk; i++) {
      const f = randomFoodCell(snake);
      const inGrid = f && f.x >= 0 && f.x < GRID_SIZE && f.y >= 0 && f.y < GRID_SIZE;
      const onSnake = f && snake.some((s) => s.x === f.x && s.y === f.y);
      if (!inGrid || onSnake) {
        foodOk = false;
        failDetail = '生成食物 ' + JSON.stringify(f) + ' 非法';
      }
    }
    check('randomFoodCell: 200 次均不在蛇身且在网格内', foodOk, failDetail);
  }

  // ---- randomFoodCell：满盘（蛇占满所有格子）----
  {
    const fullSnake = [];
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) fullSnake.push({ x: x, y: y });
    }
    const f = randomFoodCell(fullSnake);
    check('randomFoodCell: 满盘时返回 null', f === null, '实际 ' + JSON.stringify(f));
  }

  // ---- speedForLevel：单调不增且有下限 ----
  {
    let monotonic = true;
    let aboveFloor = true;
    for (let n = 0; n < 120; n++) {
      if (speedForLevel(n) < speedForLevel(n + 1)) monotonic = false;
      if (speedForLevel(n) < SPEED_MIN_MS) aboveFloor = false;
    }
    check('speedForLevel: 随食物数单调不增', monotonic, '出现增档');
    check('speedForLevel: 不低于速度下限', aboveFloor, '低于 ' + SPEED_MIN_MS + 'ms');
    check('speedForLevel: 0 个食物时为起始速度', speedForLevel(0) === SPEED_START_MS, '实际 ' + speedForLevel(0));
    check('speedForLevel: 食物足够多时到达速度下限', speedForLevel(120) === SPEED_MIN_MS, '实际 ' + speedForLevel(120));
    check('speedForLevel: 边界 4 个食物仍为起始速度', speedForLevel(4) === 180, '实际 ' + speedForLevel(4));
    check('speedForLevel: 边界 5 个食物降一档', speedForLevel(5) === 160, '实际 ' + speedForLevel(5));
    check('speedForLevel: 边界 30 个食物到达下限', speedForLevel(30) === 60, '实际 ' + speedForLevel(30));
  }

  // ---- flickerHzForLevel：三档映射与越界回退 ----
  check('flickerHzForLevel: 0 → 0.95Hz', flickerHzForLevel(0) === 0.95, '实际 ' + flickerHzForLevel(0));
  check('flickerHzForLevel: 1 → 1.4Hz', flickerHzForLevel(1) === 1.4, '实际 ' + flickerHzForLevel(1));
  check('flickerHzForLevel: 2 → 2.4Hz', flickerHzForLevel(2) === 2.4, '实际 ' + flickerHzForLevel(2));
  check('flickerHzForLevel: 越界 -1 回退到最快档', flickerHzForLevel(-1) === 2.4, '实际 ' + flickerHzForLevel(-1));
  check('flickerHzForLevel: 越界 3 回退到最快档', flickerHzForLevel(3) === 2.4, '实际 ' + flickerHzForLevel(3));

  // ---- 方向：禁止 180° 反向（向左时按右不生效） ----
  check('禁止反向: isOppositeDir(left, right) 为 true', isOppositeDir('left', 'right') === true, '实际 false');
  check('禁止反向: isOppositeDir(right, up) 为 false', isOppositeDir('right', 'up') === false, '实际 true');
  check('禁止反向: 向左时按右不生效（setDirection 拒绝）', (function () {
    const s = createInitialState();
    s.dir = 'left'; s.nextDir = 'left'; // 初始向左
    const ok = setDirection(s, 'right');
    return ok === false && s.nextDir === 'left';
  })(), '实际未拒绝或方向被改写');
  check('禁止反向: 同方向允许', (function () {
    const s = createInitialState();
    s.dir = 'left'; s.nextDir = 'left';
    return setDirection(s, 'left') === true && s.nextDir === 'left';
  })(), '实际被拒绝');
  check('禁止反向: 垂直转向允许', (function () {
    const s = createInitialState();
    return setDirection(s, 'up') === true && s.nextDir === 'up';
  })(), '实际被拒绝');
  check('禁止反向: 一 tick 内先 up 再 down 被拒绝', (function () {
    const s = createInitialState();
    setDirection(s, 'up'); // 相对 right 垂直，允许 → nextDir='up'
    return setDirection(s, 'down') === false && s.nextDir === 'up';
  })(), '实际未拒绝或 nextDir 被改写');
  check('禁止反向: stepGame 防御直接置入的反向 nextDir', (function () {
    const s = createInitialState();
    s.food = { x: 20, y: 20 };
    s.nextDir = 'left'; // 绕过 setDirection 直接注入反向
    const r = stepGame(s);
    return !r.gameOver && samePoint(r.state.snake[0], { x: 11, y: 10 });
  })(), '实际按反向移动');

  // ---- stepGame：正常移动（不进食，尾段腾空） ----
  {
    const s = createInitialState();
    s.food = { x: 20, y: 20 };
    const r = stepGame(s);
    check('stepGame: 未进食时蛇长不变', r.state.snake.length === 3 && !r.ate && !r.gameOver, '实际长度 ' + r.state.snake.length + ' ate=' + r.ate + ' over=' + r.gameOver);
    check('stepGame: 未进食时头部右移一格', samePoint(r.state.snake[0], { x: 11, y: 10 }), '实际 ' + JSON.stringify(r.state.snake[0]));
    check('stepGame: 尾部腾空移入合法', (function () {
      const s2 = createInitialState();
      s2.snake = [{ x: 5, y: 5 }, { x: 5, y: 6 }];
      s2.dir = 'down'; s2.nextDir = 'down';
      s2.food = { x: 0, y: 0 };
      const r2 = stepGame(s2);
      return !r2.gameOver && r2.state.snake.length === 2 && samePoint(r2.state.snake[0], { x: 5, y: 6 });
    })(), '移入尾格被误判为碰撞');
  }

  // ---- stepGame：吃食物 ----
  {
    const s = createInitialState();
    s.food = { x: 11, y: 10 }; // 下一步即食物
    const r = stepGame(s);
    check('stepGame: 吃食物后蛇长 +1', r.ate === true && r.state.snake.length === 4, '实际 ate=' + r.ate + ' 长度 ' + r.state.snake.length);
    check('stepGame: 吃食物后分数 +10', r.state.score === 10, '实际 ' + r.state.score);
    check('stepGame: 吃食物后 foodsEaten +1', r.state.foodsEaten === 1, '实际 ' + r.state.foodsEaten);
    check('stepGame: 吃食物后新食物不在蛇身', (function () {
      const f = r.state.food;
      return !!f && !r.state.snake.some(function (seg) { return seg.x === f.x && seg.y === f.y; });
    })(), '实际 ' + JSON.stringify(r.state.food));
    check('stepGame: foodCell 可指定新食物位置', (function () {
      const s = createInitialState();
      s.food = { x: 11, y: 10 }; // 先让本步能吃到食物
      const r2 = stepGame(s, { foodCell: { x: 0, y: 0 } });
      return samePoint(r2.state.food, { x: 0, y: 0 });
    })(), '实际 ' + JSON.stringify(stepGame(createInitialState(), { foodCell: { x: 0, y: 0 } }).state.food));
  }

  // ---- stepGame：撞墙 / 撞身触发 gameOver ----
  {
    const s = createInitialState();
    s.snake = [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }];
    s.dir = 'left'; s.nextDir = 'left';
    s.food = { x: 20, y: 20 };
    const r = stepGame(s);
    check('stepGame: 撞墙触发 gameOver', r.gameOver === true && r.state.gameOver === true, '实际 ' + r.gameOver);
  }
  {
    const s = createInitialState();
    s.snake = [{ x: 5, y: 5 }, { x: 6, y: 5 }, { x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }, { x: 4, y: 5 }];
    s.dir = 'down'; s.nextDir = 'down';
    s.food = { x: 0, y: 0 };
    const r = stepGame(s);
    check('stepGame: 撞身触发 gameOver', r.gameOver === true, '实际 ' + r.gameOver);
  }
  {
    const s = createInitialState();
    s.snake = [{ x: 5, y: 5 }, { x: 5, y: 6 }];
    s.dir = 'down'; s.nextDir = 'down';
    s.food = { x: 5, y: 6 }; // 尾格上有食物：进食 → 不腾尾 → 撞身
    const r = stepGame(s);
    check('stepGame: 进食 tick 移入未腾空尾格算撞身', r.ate === true && r.gameOver === true, '实际 ate=' + r.ate + ' over=' + r.gameOver);
  }
  check('stepGame: 不改动传入 state（纯净）', (function () {
    const s = createInitialState();
    s.food = { x: 20, y: 20 };
    const before = JSON.stringify(s);
    stepGame(s);
    return JSON.stringify(s) === before;
  })(), '实际被修改');


  // ---- 输入控制：directionForKey 键位映射（Task 3）----
  check('directionForKey: ArrowUp → up', directionForKey('ArrowUp') === 'up', '实际 ' + directionForKey('ArrowUp'));
  check('directionForKey: w / W → up', directionForKey('w') === 'up' && directionForKey('W') === 'up', '实际 ' + directionForKey('w') + ' / ' + directionForKey('W'));
  check('directionForKey: ArrowDown → down', directionForKey('ArrowDown') === 'down', '实际 ' + directionForKey('ArrowDown'));
  check('directionForKey: s / S → down', directionForKey('s') === 'down' && directionForKey('S') === 'down', '实际 ' + directionForKey('s') + ' / ' + directionForKey('S'));
  check('directionForKey: ArrowLeft → left', directionForKey('ArrowLeft') === 'left', '实际 ' + directionForKey('ArrowLeft'));
  check('directionForKey: a / A → left', directionForKey('a') === 'left' && directionForKey('A') === 'left', '实际 ' + directionForKey('a') + ' / ' + directionForKey('A'));
  check('directionForKey: ArrowRight → right', directionForKey('ArrowRight') === 'right', '实际 ' + directionForKey('ArrowRight'));
  check('directionForKey: d / D → right', directionForKey('d') === 'right' && directionForKey('D') === 'right', '实际 ' + directionForKey('d') + ' / ' + directionForKey('D'));
  check('directionForKey: 无效键返回 null', directionForKey('x') === null && directionForKey('Enter') === null && directionForKey('') === null, '实际 ' + JSON.stringify(directionForKey('x')));

  // ---- 输入控制：steerByMouse 主导轴转向（Task 3）----
  {
    const s = createInitialState(); // 蛇头 (10,10)，初始 dir=right
    const ok = steerByMouse(s, { x: 15, y: 10 });
    check('steerByMouse: 鼠标在蛇头右侧 → right', ok === true && s.nextDir === 'right', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    const ok = steerByMouse(s, { x: 10, y: 3 });
    check('steerByMouse: 鼠标在蛇头上方 → up', ok === true && s.nextDir === 'up', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    const ok = steerByMouse(s, { x: 11, y: 15 }); // dx=1, dy=5：垂直分量主导
    check('steerByMouse: 垂直分量主导 → down', ok === true && s.nextDir === 'down', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    const ok = steerByMouse(s, { x: 15, y: 11 }); // dx=5, dy=1：水平分量主导
    check('steerByMouse: 水平分量主导 → right', ok === true && s.nextDir === 'right', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    const ok = steerByMouse(s, { x: 12, y: 12 }); // dx=2, dy=2 平局 → 水平优先
    check('steerByMouse: 平局时水平优先 → right', ok === true && s.nextDir === 'right', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    s.dir = 'right'; s.nextDir = 'right';
    const ok = steerByMouse(s, { x: 5, y: 10 }); // 鼠标在左侧：相对当前方向 180° 反向
    check('steerByMouse: 180° 反向被拒绝且 nextDir 不变', ok === false && s.nextDir === 'right', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    const ok = steerByMouse(s, { x: 10, y: 10 }); // 鼠标正落在蛇头上
    check('steerByMouse: 鼠标在蛇头上不产生方向', ok === false && s.nextDir === 'right', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    s.dir = 'down'; s.nextDir = 'down';
    const ok = steerByMouse(s, { x: -5, y: 10 }); // 鼠标越界：钳制到 (0,10) → left
    check('steerByMouse: 越界鼠标坐标先钳制回网格', ok === true && s.nextDir === 'left', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    const ok = steerByMouse(s, null); // 尚无鼠标数据
    check('steerByMouse: 无鼠标数据返回 false 且不改方向', ok === false && s.nextDir === 'right', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }

  // ---- 输入控制：togglePause 暂停往返（Task 3）----
  {
    const s = createInitialState(); // paused=false
    const r1 = togglePause(s);
    const p1 = s.paused;
    const r2 = togglePause(s);
    const p2 = s.paused;
    check('togglePause: 暂停 → 恢复（往返不变）', p1 === true && p2 === false, '实际 ' + p1 + ' → ' + p2);
    check('togglePause: 原地修改并返回同一 state', r1 === s && r2 === s, '实际返回了不同对象');
  }

  // ---- 输入控制：handleGameKey 运行态守卫（Task 3）----
  {
    const s = createInitialState(); // running=false：未开始
    const before = JSON.stringify(s);
    const ok = handleGameKey(s, 'ArrowUp');
    check('handleGameKey: 未运行时方向键不生效', ok === false && JSON.stringify(s) === before, '实际 ok=' + ok);
  }
  {
    const s = createInitialState();
    s.running = true; s.gameOver = true; // gameOver 后
    const before = JSON.stringify(s);
    const ok = handleGameKey(s, 'ArrowUp');
    check('handleGameKey: gameOver 后方向键不生效', ok === false && JSON.stringify(s) === before, '实际 ok=' + ok);
  }
  {
    const s = createInitialState();
    s.running = true; s.gameOver = true;
    const ok = handleGameKey(s, ' ');
    check('handleGameKey: gameOver 后空格不暂停', ok === false && s.paused === false, '实际 ok=' + ok + ' paused=' + s.paused);
  }
  {
    const s = createInitialState();
    s.running = true;
    const ok = handleGameKey(s, 'ArrowUp');
    check('handleGameKey: 运行中方向键生效', ok === true && s.nextDir === 'up', '实际 ok=' + ok + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    s.running = true;
    const ok = handleGameKey(s, 'P');
    check('handleGameKey: 运行中 P 切换暂停', ok === true && s.paused === true, '实际 ok=' + ok + ' paused=' + s.paused);
  }
  {
    const s = createInitialState();
    s.running = true;
    const before = JSON.stringify(s);
    const ok = handleGameKey(s, 'Enter');
    check('handleGameKey: 无效键返回 false 且不改状态', ok === false && JSON.stringify(s) === before, '实际 ok=' + ok);
  }

  // ---- 输入控制：键盘命中复位鼠标跟随（审查修复）----
  {
    const s = createInitialState();
    s.running = true; s.mouseActive = true;
    const ok = handleGameKey(s, 'ArrowUp');
    check('handleGameKey: 方向键命中后 mouseActive 复位（键盘接管）', ok === true && s.mouseActive === false && s.nextDir === 'up', '实际 ok=' + ok + ' mouseActive=' + s.mouseActive + ' nextDir=' + s.nextDir);
  }
  {
    const s = createInitialState();
    s.running = true; s.mouseActive = true;
    const ok = handleGameKey(s, ' ');
    check('handleGameKey: 暂停键不重置鼠标跟随', ok === true && s.mouseActive === true && s.paused === true, '实际 ok=' + ok + ' mouseActive=' + s.mouseActive);
  }
  {
    const s = createInitialState();
    s.running = true; s.mouseActive = true;
    s.dir = 'right'; s.nextDir = 'right';
    const ok = handleGameKey(s, 'ArrowLeft'); // 180° 反向被拒
    check('handleGameKey: 反向键被拒时保留鼠标跟随（仅成功时接管）', ok === true && s.nextDir === 'right' && s.mouseActive === true, '实际 ok=' + ok + ' nextDir=' + s.nextDir + ' mouseActive=' + s.mouseActive);
  }


  // ---- 背景刺激层：pickNextMode（Task 4）----
  check('pickNextMode: 无启用模式返回 -1', (function () {
    return pickNextMode(2, [false, false, false, false, false, false]) === -1;
  })(), '未返回 -1');
  check('pickNextMode: 单个启用模式返回该模式', (function () {
    return pickNextMode(3, [false, true, false, false, false, false]) === 1;
  })(), '未返回唯一启用模式');
  {
    let neverRepeat = true;
    let inRange = true;
    for (let i = 0; i < 300; i++) {
      const next = pickNextMode(2, [true, true, true, true, true, true]);
      if (next === 2) neverRepeat = false;
      if (next < 0 || next > 5) inRange = false;
    }
    check('pickNextMode: 300 次不与上一次重复且在范围内', neverRepeat && inRange, '出现重复或越界');
  }
  {
    let ok = true;
    for (let i = 0; i < 200; i++) {
      const next = pickNextMode(-1, [false, false, true, false, true, false]);
      if (next !== 2 && next !== 4) ok = false;
    }
    check('pickNextMode: 只从启用模式中选取', ok, '选中了未启用模式');
  }
  check('背景设置: MODE_IDS 与 settings.modes 均为 6 项且默认全选', (function () {
    return MODE_IDS.length === 6 && settings.modes.length === 6 && settings.modes.every(function (m) { return m === true; });
  })(), '数量或默认值不符');

  // ---- 背景刺激层：pickColorPalette（Task 4）----
  check('COLOR_PALETTES: 恰好 4 组且含前景/背景色', (function () {
    return COLOR_PALETTES.length === 4 && COLOR_PALETTES.every(function (p) { return typeof p.fg === 'string' && typeof p.bg === 'string'; });
  })(), '实际 ' + COLOR_PALETTES.length + ' 组');
  {
    let neverRepeat = true;
    let inRange = true;
    for (let i = 0; i < 300; i++) {
      const next = pickColorPalette(0);
      if (next === 0) neverRepeat = false;
      if (next < 0 || next >= COLOR_PALETTES.length) inRange = false;
    }
    check('pickColorPalette: 300 次不与上一次重复且在范围内', neverRepeat && inRange, '出现重复或越界');
  }
  {
    let ok = true;
    for (let i = 0; i < 50; i++) {
      const next = pickColorPalette(-1);
      if (next < 0 || next >= COLOR_PALETTES.length) ok = false;
    }
    check('pickColorPalette: previousIndex=-1 时返回合法索引', ok, '出现越界');
  }

  // ---- 背景刺激层：jitterHz ±20% 抖动（Task 4）----
  {
    let inBand = true;
    let varies = false;
    let first = null;
    for (let i = 0; i < 200; i++) {
      const j = jitterHz(1.4);
      if (j < 1.4 * 0.8 || j > 1.4 * 1.2) inBand = false;
      if (first === null) first = j;
      else if (j !== first) varies = true;
    }
    check('jitterHz: 200 次均落在 ±20% 区间', inBand, '超出 [0.8, 1.2] × baseHz');
    check('jitterHz: 结果存在随机波动（非恒定）', varies, '始终返回同一值');
  }
  {
    let ok = true;
    for (let i = 0; i < 50; i++) {
      const j = jitterHz(0.95);
      if (j < 0.95 * 0.8 || j > 0.95 * 1.2) ok = false;
    }
    check('jitterHz: 0.95Hz 档位抖动也在区间内', ok, '超出区间');
  }

  return results;
}

// 把测试结果输出到 console
function logSelfTestResults(results) {
  let pass = 0;
  let fail = 0;
  for (let i = 0; i < results.length; i++) {
    if (results[i].pass) {
      pass++;
      console.log('  PASS ' + results[i].name);
    } else {
      fail++;
      console.log('  FAIL ' + results[i].name + (results[i].detail ? ' -- ' + results[i].detail : ''));
    }
  }
  console.log('SELF-TEST PASS ' + pass + '/FAIL ' + fail);
}

// 把测试结果渲染到页面顶部横幅
function renderSelfTestBanner(results) {
  let pass = 0;
  let fail = 0;
  for (let i = 0; i < results.length; i++) {
    if (results[i].pass) pass++;
    else fail++;
  }
  const banner = document.getElementById('testBanner');
  if (banner) {
    banner.textContent = 'SELF-TEST PASS (' + pass + ')/FAIL (' + fail + ')';
    banner.classList.remove('hidden');
    banner.classList.add(fail === 0 ? 'test-pass' : 'test-fail');
  }
}

/* ---------- 浏览器端初始化（Node 下自动跳过） ---------- */
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  /* ---------- 浏览器端实现（Node 下自动跳过） ---------- */

  const HIGH_SCORE_KEY = 'amblyopia_snake_highscore_v1';
  let state = createInitialState();   // 当前一局的状态
  let animationId = null;             // rAF 句柄
  let lastFrameTs = null;             // 上一帧时间戳（用于时间累积）
  let accMs = 0;                      // 距下一次移动累积的毫秒数
  let lastMouseCell = null;           // 鼠标在游戏屏上的最近目标格（Task 3，每 tick 用于鼠标跟随）

  /* ---------- 背景刺激层（Task 4）：独立 rAF 循环 + 6 模式 + 配色/闪烁/轮换 ---------- */
  const bgCanvasEl = document.getElementById('bgCanvas');
  let bgInitialized = false;        // 背景是否已初始化（首次进入游戏时）
  let bgAnimId = null;              // 背景循环 rAF 句柄
  let bgModeIndex = 0;              // 当前模式索引（对应 MODE_IDS）
  let bgPaletteIndex = 0;           // 当前配色索引（对应 COLOR_PALETTES）
  let bgModeT0 = 0;                 // 当前模式开始时间戳（ms，与 rAF 同源）
  let bgRotateAt = 0;               // 下次模式/配色轮换时刻（ms）
  let bgAccentAt = 0;               // 混合模式下次点缀时刻（ms）
  let bgFlickerHz = jitterHz(flickerHzForLevel(settings.flickerLevel)); // 当前闪烁频率（Hz）
  let bgFreezeT = null;             // 闪烁关闭时的冻结相位（秒）：保留最后一帧
  let bgPauseStart = null;          // 进入暂停的时间戳（恢复时扣除暂停时长）
  let bgSeed = 0;                   // 当前模式图案几何种子
  let bgGeom = null;                // 当前模式预生成几何（种子随机，避免逐帧抖动）
  let bgGeomDirty = true;           // 需要重建几何（进入新模式或画布尺寸变化）
  let bgAccents = [];               // 混合模式彩色点缀列表

  // 重建几何：模式/种子变化或画布尺寸变化时调用
  function ensureBgGeom() {
    if (!bgGeomDirty) return;
    bgGeom = buildBgGeom(bgModeIndex, bgSeed, bgCanvasEl.width, bgCanvasEl.height);
    bgGeomDirty = false;
  }

  // 进入新模式的初始化：换种子、重置相位与闪烁频率、清空点缀
  function newBgPattern(now) {
    bgSeed = (Math.random() * 0xffffffff) >>> 0;
    bgGeomDirty = true;
    bgModeT0 = now;
    bgFlickerHz = jitterHz(flickerHzForLevel(settings.flickerLevel)); // 每次进入新模式重新取值
    bgAccents = [];
    bgAccentAt = now + randRange(BG_ACCENT_MIN_MS, BG_ACCENT_MAX_MS);
  }

  // 每 20-40s 轮换一次：形状开关决定是否换模式，颜色开关决定是否换配色
  function rotateBgPattern(now) {
    let modeChanged = false;
    if (settings.shapeChange) {
      const next = pickNextMode(bgModeIndex, settings.modes);
      if (next >= 0 && next !== bgModeIndex) {
        bgModeIndex = next;
        modeChanged = true;
      }
    }
    if (settings.colorChange) {
      const next = pickColorPalette(bgPaletteIndex);
      if (next !== bgPaletteIndex) bgPaletteIndex = next;
    }
    if (modeChanged) newBgPattern(now); // 换模式：新种子 + 新闪烁频率 + 清点缀
    bgRotateAt = now + randRange(BG_ROTATE_MIN_MS, BG_ROTATE_MAX_MS);
  }

  // 背景初始化（首次开始游戏时）：随机首模式与配色
  function initBg(now) {
    bgModeIndex = pickNextMode(-1, settings.modes);
    if (bgModeIndex < 0) bgModeIndex = 0; // 全部未勾选时退回红光闪烁
    bgPaletteIndex = pickColorPalette(-1);
    bgRotateAt = now + randRange(BG_ROTATE_MIN_MS, BG_ROTATE_MAX_MS);
    newBgPattern(now);
    bgInitialized = true;
  }

  // 混合模式点缀：每 5-8s 穿插 1-2 个彩色圆点（上限 ACCENT_MAX，超出淘汰最旧）
  function addBgAccent(now) {
    const w = bgCanvasEl.width;
    const h = bgCanvasEl.height;
    const count = Math.random() < 0.5 ? 1 : 2;
    for (let i = 0; i < count; i++) {
      bgAccents.push({
        x: 20 + Math.random() * (w - 40),
        y: 20 + Math.random() * (h - 40),
        r: 10 + Math.random() * 14,
        color: ACCENT_COLORS[Math.floor(Math.random() * ACCENT_COLORS.length)]
      });
      if (bgAccents.length > ACCENT_MAX) bgAccents.shift();
    }
    bgAccentAt = now + randRange(BG_ACCENT_MIN_MS, BG_ACCENT_MAX_MS);
  }

  // 每帧渲染：顺序 = 模式图案 → 混合点缀 → 闪烁叠加
  function drawBgFrame(ctx, t) {
    ensureBgGeom();
    const cfg = {
      w: bgCanvasEl.width,
      h: bgCanvasEl.height,
      t: t,
      palette: COLOR_PALETTES[bgPaletteIndex],
      geom: bgGeom,
      accents: bgAccents,
      flickerHz: bgFlickerHz,
      flicker: settings.flickerChange
    };
    BG_DRAWERS[bgModeIndex](ctx, t, cfg);
    if (settings.colorMode === 'mixed') {
      for (let i = 0; i < bgAccents.length; i++) {
        const a = bgAccents[i];
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // red_flicker 模式本身即按 flickerHz 闪烁，不再叠加全局闪烁层
    if (settings.flickerChange && bgModeIndex !== 0) drawFlickerOverlay(ctx, t, cfg);
  }

  // 背景渲染循环：独立 rAF；尺寸与窗口同步；暂停/结束/隐藏时停止并保留当前帧
  function bgLoop(timestamp) {
    const screenHidden = document.getElementById('gameScreen').classList.contains('hidden');
    if (screenHidden || !state.running || state.gameOver) {
      bgAnimId = null;
      return; // 保留当前帧，不重绘不闪烁
    }
    if (state.paused) {
      if (bgPauseStart === null) bgPauseStart = timestamp;
      bgAnimId = null;
      return; // 暂停：冻结动画（保留当前帧），避免无谓闪烁
    }
    // 尺寸与窗口同步：画布分辨率跟随其显示尺寸
    const dw = Math.max(1, Math.round(bgCanvasEl.clientWidth));
    const dh = Math.max(1, Math.round(bgCanvasEl.clientHeight));
    if (bgCanvasEl.width !== dw || bgCanvasEl.height !== dh) {
      bgCanvasEl.width = dw;
      bgCanvasEl.height = dh;
      bgGeomDirty = true; // 尺寸变化：按同一种子重建几何
    }
    const ctx = bgCanvasEl.getContext('2d');
    // 闪烁关闭：冻结相位并跳过轮换/点缀，背景完全静止
    if (!settings.flickerChange) {
      if (bgFreezeT === null) bgFreezeT = (timestamp - bgModeT0) / 1000;
      drawBgFrame(ctx, bgFreezeT);
      bgAnimId = requestAnimationFrame(bgLoop);
      return;
    }
    bgFreezeT = null;
    // 每 20-40s 轮换模式/配色；混合模式每 5-8s 穿插彩色点缀
    if (timestamp >= bgRotateAt) rotateBgPattern(timestamp);
    if (settings.colorMode === 'mixed' && timestamp >= bgAccentAt) addBgAccent(timestamp);
    drawBgFrame(ctx, (timestamp - bgModeT0) / 1000);
    bgAnimId = requestAnimationFrame(bgLoop);
  }

  // 启动背景循环：已在运行时不重复启动；从暂停恢复时扣除暂停时长，图案相位不跳变
  function startBgLoop() {
    if (!bgCanvasEl || bgAnimId !== null) return;
    if (!state.running || state.paused || state.gameOver) return;
    if (bgPauseStart !== null) {
      bgModeT0 += (performance.now() - bgPauseStart); // 扣除暂停时间，图案接续暂停前位置
      bgPauseStart = null;
    }
    bgAnimId = requestAnimationFrame(bgLoop);
  }

  // 停止背景循环：画布保留当前帧
  function stopBgLoop() {
    if (bgAnimId !== null) {
      cancelAnimationFrame(bgAnimId);
      bgAnimId = null;
    }
  }


  // 读取最高分（localStorage 缺失、非法或读取异常时返回 0）
  function readHighScore() {
    try {
      if (typeof localStorage !== 'undefined') {
        const raw = localStorage.getItem(HIGH_SCORE_KEY);
        const n = parseInt(raw, 10);
        return Number.isFinite(n) && n > 0 ? n : 0;
      }
    } catch (e) {
      // 隐私模式 / file:// 受限等场景下读取失败，静默按 0 处理
    }
    return 0;
  }

  // 写入最高分（写入失败如配额满时静默忽略）
  function writeHighScore(score) {
    try {
      if (typeof localStorage !== 'undefined') localStorage.setItem(HIGH_SCORE_KEY, String(score));
    } catch (e) {
      // 静默忽略：最高分无法持久化不影响游戏进行
    }
  }

  // 同步最高分：超过历史最高分时立即持久化，返回当前最高分
  function syncHighScore() {
    const high = readHighScore();
    if (state.score > high) {
      writeHighScore(state.score);
      return state.score;
    }
    return high;
  }

  // 刷新 HUD：分数 / 最高分 / 速度档
  function updateHud() {
    document.getElementById('hudScore').textContent = String(state.score);
    document.getElementById('hudHighScore').textContent = String(syncHighScore());
    document.getElementById('hudSpeed').textContent = String(Math.min(1 + Math.floor(state.foodsEaten / SPEED_STEP), MAX_SPEED_LEVEL));
  }

  // 在 #gameCanvas 上绘制蛇与食物（网格按 canvas 尺寸均分）
  function renderGame() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cell = canvas.width / GRID_SIZE;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 蛇身（高对比黄）
    ctx.fillStyle = '#ffd400';
    for (let i = 1; i < state.snake.length; i++) {
      const seg = state.snake[i];
      ctx.fillRect(seg.x * cell, seg.y * cell, cell, cell);
    }
    // 蛇头（白色高亮）
    const head = state.snake[0];
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(head.x * cell, head.y * cell, cell, cell);
    // 食物（高对比红）
    if (state.food) {
      ctx.fillStyle = '#ff2d2d';
      ctx.fillRect(state.food.x * cell, state.food.y * cell, cell, cell);
    }
  }

  // 每 tick 走一步：只更新逻辑与 HUD，渲染统一在帧末进行
  function tick() {

    // 鼠标跟随：每 tick 由蛇头到鼠标的向量取主导轴方向
    // （键盘方向键命中后 handleGameKey 已复位 mouseActive，此处不再覆盖）
    if (state.mouseActive && lastMouseCell) {
      steerByMouse(state, lastMouseCell);
    }
    const result = stepGame(state);
    state = result.state;
    if (result.ate) {
      // TODO(Task6): 播放音效（吃到食物）
      updateHud();
    }
    if (result.gameOver) {
      // TODO(Task6): 播放音效（游戏结束）
      gameOver();
    }
  }

  // 主循环：requestAnimationFrame + 时间累积，达到 speedForLevel(foodsEaten) 毫秒走一格
  function loop(timestamp) {
    if (state.gameOver) {
      animationId = null;
      return;
    }
    if (state.running && !state.paused) {
      startBgLoop(); // 背景循环随游戏运行启停（暂停时 bgLoop 自行停止并保留帧）
      const dt = lastFrameTs === null ? 0 : Math.min(timestamp - lastFrameTs, 250);
      lastFrameTs = timestamp;
      accMs += dt;
      let steps = 0;
      // 帧间隔抖动时一次最多补 3 格，避免长时间卡顿后瞬间连跳；每步重取速度，加速即时生效
      while (state.running && !state.paused && !state.gameOver && steps < 3) {
        const interval = speedForLevel(state.foodsEaten);
        if (accMs < interval) break;
        accMs -= interval;
        steps++;
        tick();
      }
      if (state.gameOver) return; // 结束后不再调度空转帧
      renderGame();               // 帧末统一渲染一次（含 catch-up 多步后的最新状态）
    } else {
      // 暂停/未运行时清零累积，避免恢复瞬间跳格
      accMs = 0;
      lastFrameTs = null;
    }
    animationId = requestAnimationFrame(loop);
  }

  // 游戏结束：停止主循环、更新最高分、显示结束浮层
  function gameOver() {
    state.running = false;
    state.gameOver = true;
    stopBgLoop(); // 结束浮层覆盖：停止背景循环并保留当前帧
    syncHighScore();
    document.getElementById('endScore').textContent = String(state.score);
    document.getElementById('endHighScore').textContent = String(readHighScore());
    document.getElementById('endOverlay').classList.remove('hidden');
  }

  // 开始 / 再玩一次：重置状态并启动主循环
  function startGame() {
    state = createInitialState();
    state.food = randomFoodCell(state.snake);
    state.running = true;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('endOverlay').classList.add('hidden');
    accMs = 0;
    lastFrameTs = null;
    lastMouseCell = null; // 跨局清除鼠标目标格，避免残留跟随
    updateHud();
    renderGame();
    if (!bgInitialized) initBg(performance.now()); // 首次开始：初始化背景
    startBgLoop(); // 开始游戏：启动背景循环
    cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(loop);
  }

  // 开始屏最高分展示
  const startHigh = document.getElementById('startHighScore');
  if (startHigh) startHigh.textContent = String(readHighScore());
  // 开始按钮（键盘/触控输入为 Task 3）
  const btnStart = document.getElementById('btnStart');
  if (btnStart) btnStart.addEventListener('click', startGame);
  // 结束浮层“再玩一次”
  const btnRestart = document.getElementById('btnRestart');
  if (btnRestart) btnRestart.addEventListener('click', startGame);

  // ---- 输入控制：键盘（方向键 / WASD + 空格、P 暂停）----
  function onKeyDown(e) {
    if (e.repeat) return; // 长按重复触发（约 30Hz）跳过，避免空格/P 快速抖动暂停
    if (!state.running || state.gameOver) return; // 未开始 / 已结束：按键不生效
    if (handleGameKey(state, e.key)) e.preventDefault(); // 命中方向或暂停键时阻止默认行为（滚动/聚焦）
  }
  window.addEventListener('keydown', onKeyDown);

  // ---- 输入控制：鼠标 ----
  const gameCanvasEl = document.getElementById('gameCanvas');

  // 把鼠标事件坐标换算为网格坐标（相对 #gameCanvas，按实际显示尺寸等比换算）
  function canvasMouseToCell(e) {
    const rect = gameCanvasEl.getBoundingClientRect();
    const x = Math.floor(((e.clientX - rect.left) / rect.width) * GRID_SIZE);
    const y = Math.floor(((e.clientY - rect.top) / rect.height) * GRID_SIZE);
    return { x: x, y: y };
  }

  // 鼠标在游戏屏移动：记录目标格并启用鼠标跟随（每 tick 由 steerByMouse 转向）
  function onMouseMove(e) {
    lastMouseCell = canvasMouseToCell(e);
    state.mouseActive = true;
  }

  // 按住左键：锁定跟随（鼠标不动也持续朝目标格转向）
  function onMouseDown(e) {
    if (e.button === 0) {
      lastMouseCell = canvasMouseToCell(e);
      state.mouseActive = true;
    }
  }

  // 松开左键：恢复键盘优先（绑定到 window，避免在画布外松开时残留锁定）
  function onMouseUp(e) {
    if (e.button === 0) state.mouseActive = false;
  }

  if (gameCanvasEl) {
    gameCanvasEl.addEventListener('mousemove', onMouseMove);
    gameCanvasEl.addEventListener('mousedown', onMouseDown);
  }
  window.addEventListener('mouseup', onMouseUp);
  // 鼠标离开窗口 / 窗口失焦：清除跟随锁定，避免在窗口外松开鼠标时 mouseActive 残留
  function onWindowLeave() {
    state.mouseActive = false;
  }
  window.addEventListener('mouseleave', onWindowLeave);
  window.addEventListener('blur', onWindowLeave);

  // ---- 触控预留（平板 WebView 接入点）----
  // 后续实现滑动转向：touchstart 记录起点、touchmove 实时换算目标格、
  // touchend 计算滑动方向，经 setDirection / steerByMouse 写入 nextDir。
  // 填充实现时需将三个处理器 addEventListener 绑定到 #gameCanvas，并 e.preventDefault() 抑制合成鼠标事件。
  function handleTouchStart(e) { /* 平板 WebView 接入点：预留 */ }
  function handleTouchMove(e) { /* 平板 WebView 接入点：预留 */ }
  function handleTouchEnd(e) { /* 平板 WebView 接入点：预留 */ }

  if (new URLSearchParams(window.location.search).has('test')) {
    const selfTestResults = runSelfTests();
    logSelfTestResults(selfTestResults);
    renderSelfTestBanner(selfTestResults);
  }
}

/* ---------- 无头验证接口（verify_snake.js 使用） ---------- */
globalThis.__snakeTests = {
  runSelfTests: runSelfTests
};
</script>
