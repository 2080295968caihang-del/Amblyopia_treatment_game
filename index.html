<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amblyopia Treatment Game · 弱视治疗训练</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 自测横幅：?test=1 时显示 -->
<div id="testBanner" class="hidden"></div>

<!-- ============ 游戏挑选菜单页 ============ -->
<div id="menuScreen" class="screen">
  <canvas id="menuBgCanvas" aria-hidden="true"></canvas>
  <div class="menu-bg-dim" aria-hidden="true"></div>
  <header class="menu-header">
    <h1 class="menu-title">弱视治疗训练</h1>
    <button id="btnOpenSettings" class="icon-btn" title="家长设置" aria-label="家长设置">⚙</button>
  </header>
  <main class="menu-main">
    <section class="game-cards" aria-label="选择游戏">
      <!-- 贪吃蛇 -->
      <div id="card-snake" class="card card-snake">
        <div class="card-art" aria-hidden="true">🐍</div>
        <h2 class="card-name">贪吃蛇</h2>
        <p class="card-desc">移动小蛇吃果子，训练注视与追踪</p>
        <button id="btnStartSnake" class="btn btn-primary">开始</button>
      </div>
      <!-- 敬请期待占位 -->
      <div class="card card-soon" aria-disabled="true">
        <div class="card-art" aria-hidden="true">🎯</div>
        <h2 class="card-name">寻找目标</h2>
        <p class="card-desc">敬请期待</p>
      </div>
      <div class="card card-soon" aria-disabled="true">
        <div class="card-art" aria-hidden="true">✋</div>
        <h2 class="card-name">手眼协调</h2>
        <p class="card-desc">敬请期待</p>
      </div>
    </section>
    <p class="eye-reminder" role="note">👁 请先遮盖好眼，只用弱视眼看</p>
  </main>
</div>

<!-- ============ 游戏屏（贪吃蛇） ============ -->
<div id="gameScreen" class="screen hidden">
  <div class="hud">
    <div class="hud-stats">
      <span>分数 <b id="hudScore">0</b></span>
      <span>最高 <b id="hudHighScore">0</b></span>
      <span>速度 <b id="hudSpeed">1</b></span>
    </div>
    <div class="hud-actions">
      <button id="btnPause" class="btn btn-small">⏸ 暂停</button>
      <button id="btnMute" class="btn btn-small">🔊 音效开</button>
    </div>
  </div>
  <div class="hud-reminder">👁 请先遮盖好眼，只用弱视眼看</div>
  <div class="board-wrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
  </div>
</div>

<!-- ============ 游戏内 Esc 菜单 ============ -->
<div id="gameMenuOverlay" class="overlay hidden">
  <div class="overlay-card">
    <h2>已暂停</h2>
    <button id="btnResume" class="btn btn-primary btn-block">▶ 继续</button>
    <button id="btnMenuSettings" class="btn btn-block">⚙ 设置</button>
    <button id="btnRestart" class="btn btn-block">🔄 重新开始</button>
    <button id="btnBackMenu" class="btn btn-block">🏠 返回游戏列表</button>
  </div>
</div>

<!-- ============ 游戏结束浮层 ============ -->
<div id="endOverlay" class="overlay hidden">
  <div class="overlay-card">
    <h2>游戏结束</h2>
    <p>本次分数 <b id="endScore">0</b></p>
    <p>最高分 <b id="endHighScore">0</b></p>
    <button id="btnPlayAgain" class="btn btn-primary btn-block">🔄 再玩一次</button>
    <button id="btnEndBackMenu" class="btn btn-block">🏠 返回游戏列表</button>
  </div>
</div>

<!-- ============ 家长设置抽屉 ============ -->
<div id="drawerMask" class="mask hidden"></div>
<aside id="settingsDrawer" class="drawer hidden" role="dialog" aria-label="家长设置">
  <div class="drawer-head">
    <h2>家长设置</h2>
    <button id="btnDrawerClose" class="icon-btn" title="关闭" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <div class="setting-group">
      <h3>闪烁档位</h3>
      <div class="option-row">
        <label><input type="radio" name="flickerLevel" value="0"> 慢 (1.2Hz)</label>
        <label><input type="radio" name="flickerLevel" value="1"> 中 (2Hz)</label>
        <label><input type="radio" name="flickerLevel" value="2"> 快 (3.2Hz)</label>
      </div>
    </div>
    <div class="setting-group">
      <h3>刺激模式（勾选参与轮换）</h3>
      <div class="option-row">
        <label><input type="checkbox" name="mode" value="red_flicker"> 红光闪烁</label>
        <label><input type="checkbox" name="mode" value="cam_grating"> CAM光栅</label>
        <label><input type="checkbox" name="mode" value="checkerboard"> 棋盘格</label>
        <label><input type="checkbox" name="mode" value="stripes"> 对比条纹</label>
      </div>
    </div>
    <div class="setting-group">
      <h3>配色模式</h3>
      <div class="option-row">
        <label><input type="radio" name="colorMode" value="contrast"> 高对比</label>
        <label><input type="radio" name="colorMode" value="mixed"> 混合</label>
      </div>
    </div>
    <div class="setting-group">
      <h3>起始速度</h3>
      <div class="option-row">
        <label><input type="radio" name="startSpeed" value="1"> 很慢</label>
        <label><input type="radio" name="startSpeed" value="2"> 慢</label>
        <label><input type="radio" name="startSpeed" value="3"> 中</label>
        <label><input type="radio" name="startSpeed" value="4"> 快</label>
        <label><input type="radio" name="startSpeed" value="5"> 很快</label>
      </div>
    </div>
    <div class="setting-group">
      <h3>背景变化</h3>
      <div class="option-row">
        <label><input type="checkbox" id="colorChange"> 颜色变化</label>
        <label><input type="checkbox" id="shapeChange"> 形状变化</label>
        <label><input type="checkbox" id="flickerChange"> 闪烁变化</label>
      </div>
    </div>
    <div class="setting-group">
      <h3>音效</h3>
      <div class="option-row">
        <label><input type="checkbox" id="soundOn"> 开启音效</label>
      </div>
    </div>
    <p class="drawer-note">建议每次 10–15 分钟、每天 1–2 次；请遵医嘱；训练时遮盖好眼。</p>
  </div>
</aside>

<script src="js/bg-engine.js"></script>
<script src="js/snake.js"></script>
<script>
(function () {
  'use strict';
  /* 设置由 js/snake.js 负责加载与持久化，这里取用其引用，保证两端同步 */
  var settings = (window.SnakeGame && window.SnakeGame.getSettings) ? window.SnakeGame.getSettings() : null;

  var App = {
    settings: settings,
    // 简单路由：menu ↔ game-snake（显隐类切换）
    showScreen: function (name) {
      if (typeof document === 'undefined') return;
      var menu = document.getElementById('menuScreen');
      var game = document.getElementById('gameScreen');
      if (menu) menu.classList.toggle('hidden', name !== 'menu');
      if (game) game.classList.toggle('hidden', name !== 'game-snake');
    },
    // 由 SnakeGame.backToMenu 调用：回到游戏挑选菜单页
    backFromGame: function () {
      App.showScreen('menu');
      setupMenuBg();
    }
  };
  window.App = App;

  /* ---------- 菜单页背景预览：用同一 BgEngine 引擎轮换刺激模式 ---------- */
  var menuBgEngine = null;
  function setupMenuBg() {
    if (typeof document === 'undefined') return;
    var canvas = document.getElementById('menuBgCanvas');
    if (!canvas || !window.BgEngine) return;
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(window.innerWidth * dpr));
    var h = Math.max(1, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    if (!menuBgEngine) menuBgEngine = window.BgEngine.create(canvas, settings);
    else menuBgEngine.applySettings(settings);
    menuBgEngine.start();
  }
  function stopMenuBg() {
    if (menuBgEngine) menuBgEngine.stop();
  }

  if (typeof document !== 'undefined') {
    // 开始贪吃蛇：停掉菜单预览，切到游戏屏并启动游戏
    var btnStartSnake = document.getElementById('btnStartSnake');
    if (btnStartSnake) {
      btnStartSnake.addEventListener('click', function () {
        stopMenuBg();
        App.showScreen('game-snake');
        if (window.SnakeGame && window.SnakeGame.start) window.SnakeGame.start(settings);
      });
    }
    // 家长设置抽屉（菜单页与游戏内共用）：由 snake.js 一次性绑定
    if (window.SnakeGame && window.SnakeGame.bindSettingsUI) window.SnakeGame.bindSettingsUI();

    // 菜单屏尺寸变化时重建预览画布分辨率
    window.addEventListener('resize', function () {
      var menu = document.getElementById('menuScreen');
      if (menu && !menu.classList.contains('hidden')) setupMenuBg();
    });

    setupMenuBg(); // 启动时开启菜单页背景预览
  }

  /* ---------- ?test=1 自测入口（无 DOM 环境也暴露 __snakeTests） ---------- */
  if (window.location && window.location.search && String(window.location.search).indexOf('test') !== -1) {
    function collectTests() {
      var t = [];
      if (window.SnakeGame && window.SnakeGame.runSelfTests) t = t.concat(window.SnakeGame.runSelfTests());
      if (window.BgEngine && window.BgEngine.runSelfTests) t = t.concat(window.BgEngine.runSelfTests());
      return t;
    }
    window.__snakeTests = { runSelfTests: collectTests };
    if (typeof document !== 'undefined') {
      var all = collectTests();
      var pass = 0, fail = 0;
      for (var i = 0; i < all.length; i++) {
        if (all[i].pass) pass++;
        else { fail++; if (window.console) console.log('FAIL ' + all[i].name); }
      }
      var banner = document.getElementById('testBanner');
      if (banner) {
        banner.textContent = 'SELF-TEST PASS (' + pass + ')/FAIL (' + fail + ')';
        banner.classList.remove('hidden');
        banner.classList.add(fail === 0 ? 'test-pass' : 'test-fail');
      }
    }
  }
})();
</script>
</body>
</html>
